{% extends 'base.html' %}
{% block title %}Panel médico | Instituto Pirovano{% endblock %}
{% block content %}
<main class="dashboard container">
  <div class="page-head"><div><span class="eyebrow">Panel médico</span><h1>Conversaciones pendientes</h1><p>Respondé a tus pacientes y mantené el seguimiento de cada consulta.</p></div></div>

  <section class="panel">
    <div id="medicoConsultas" class="doctor-list">Cargando...</div>
  </section>

  <section id="doctorChatPanel" class="panel chat-panel hidden">
    <div class="chat-head">
      <div><button id="closeDoctorChat" class="back-button">← Volver</button><h2 id="doctorChatTitle">Consulta</h2><p id="doctorChatSubtitle"></p></div>
      <span id="doctorChatStatus" class="badge"></span>
    </div>
    <div id="doctorChatMessages" class="chat-messages"></div>
    <form id="doctorReplyForm" class="chat-composer" enctype="multipart/form-data">
      <textarea name="descripcion" id="doctorMessageText" rows="2" placeholder="Escribí la respuesta para el paciente..."></textarea>
      <input type="text" name="turno" id="doctorTurno" placeholder="Turno presencial (opcional)">
      <input type="text" name="medicamentos" id="doctorMedicamentos" placeholder="Receta: medicamentos (opcional)">
      <input type="text" name="indicaciones_receta" id="doctorIndicaciones" placeholder="Indicaciones de la receta (opcional)">
      <div class="composer-row">
        <label class="attach-button">📎 Adjuntar imagen<input type="file" name="imagen" id="doctorImage" accept="image/png,image/jpeg,image/webp,image/gif"></label>
        <button class="btn btn-outline" type="button" id="finalizarBtn">Finalizar consulta</button>
        <button class="btn btn-primary" type="submit">Enviar respuesta</button>
      </div>
      <div id="doctorMessageError" class="form-message"></div>
    </form>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/medico.js') }}"></script>{% endblock %}
